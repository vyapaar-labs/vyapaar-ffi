[workspace]
resolver = "2"
members = [
  "crates/vyapaar-ffi-codegen",
  "crates/vyapaar-ffi-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/vyapaar-labs/vyapaar-ffi"

[workspace.dependencies]
# Canonical shared kernel and regulatory risk gate (sibling bounded contexts).
vyapaar-core = { path = "../vyapaar-core" }
vyapaar-risk = { path = "../vyapaar-risk" }

# Serialization & schema generation.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }

# Exact decimal arithmetic (Zero Floats Policy).
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Diagnostics.
thiserror = "1"
tracing = "0.1"

# Python FFI (ABI3 = one wheel for CPython 3.10+; `auto-initialize` lets the
# `cargo test` harness spin up an embedded interpreter).
pyo3 = { version = "0.30", features = ["abi3-py310", "auto-initialize"] }

# Apache Arrow zero-copy memory bridge (C Data Interface / PyCapsule protocol).
arrow = { version = "53", default-features = false, features = ["ffi"] }

# --- Build profiles (mirrors the sibling bounded-context repos) --------------
# The ecosystem Makefiles build with `--profile prod` (LTO release) and
# `--profile dev`/`--profile dbg`, so both must be declared here.

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1

